<svg xmlns="http://www.w3.org/2000/svg" width="480" height="215" viewBox="0 0 480 215">
<defs>
<linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0.2"/></linearGradient>
<linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
<clipPath id="k"><rect x="1" y="1" width="478" height="213" rx="14"/></clipPath>
