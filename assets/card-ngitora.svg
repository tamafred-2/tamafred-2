<style>
.c{animation:in .7s 0.07s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.p{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.sh{animation:sh 5s linear infinite}
@keyframes sh{from{transform:translateX(-500px)}to{transform:translateX(500px)}}
</style>
<g class="c">
<rect x="1" y="1" width="478" height="213" rx="14" fill="url(#b)" stroke="#1f2937"/>
<g clip-path="url(#k)"><rect x="1" y="1" width="478" height="4" fill="url(#a)"/><rect class="sh" x="0" y="1" width="120" height="4" fill="#fff" opacity="0.35"/></g>
<text x="24" y="42" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f1f5f9">Ngitora</text>
<g transform="translate(377,26)"><rect width="79" height="22" rx="11" fill="#1e293b"/><rect x="11.5" y="10.5" width="9" height="6.5" rx="1.5" fill="#94a3b8"/><path d="M13.5 10.5 V8.8 a2.5 2.5 0 0 1 5 0 V10.5" fill="none" stroke="#94a3b8" stroke-width="1.3"/><text x="27" y="15" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">Private</text></g>
